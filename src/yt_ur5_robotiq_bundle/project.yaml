schema_version: 2
project_name: yt_ur5_robotiq
bundle:
  description_package: yt_ur5_robotiq_description
  moveit_config_package: yt_ur5_robotiq_trainit_config
  app_package: yt_ur5_robotiq_app
meta:
  maintainer_name: fra
  maintainer_email: ros.master.ai@gmail.com
  license: Apache-2.0
  version: 0.0.0
robot:
  robot_name: ur
  description:
    urdf_dir: /lab_ws/src/lrwros_ur5_moveit_config/config
    top_xacro: ur.urdf.xacro
    meshes_dir: null
  base_frame: base_link
  tip_link: tool0
  planning_group:
    name: ur5_manipulator
    base_link: base_link
    tip_link: tool0
    joints:
    - shoulder_pan_joint
    - shoulder_lift_joint
    - elbow_joint
    - wrist_1_joint
    - wrist_2_joint
    - wrist_3_joint
  gripper:
    kind: parallel
    eef_group_name: robotiq_gripper
    eef_name: eef
    eef_parent_link: tool0
    command_joint: robotiq_85_left_knuckle_joint
    controller_name: gripper_position_controller
    controller_type: GripperCommand
    action_ns: gripper_cmd
    grasp_action: close
    release_action: open
    open_state: open
    closed_state: closed
    actuation: joint_position
    joint_target: angle
    open_angle: 0.0001
    closed_angle: 0.3185
    sim_grasp_adapter:
      mock: link_attacher
      isaac: surface_gripper
      real: none
      gazebo: link_attacher
    interacts_with_object: true
    link_attacher:
      robot_model: ur
      robot_link: wrist_3_link
      object_model: red_cube
      object_link: link_1
  named_states:
  - name: zero
    group: ur5_manipulator
    joint_values:
      elbow_joint: 0.0
      shoulder_lift_joint: 0.0
      shoulder_pan_joint: 0.0
      wrist_1_joint: 0.0
      wrist_2_joint: 0.0
      wrist_3_joint: 0.0
  - name: up
    group: ur5_manipulator
    joint_values:
      elbow_joint: 0.0
      shoulder_lift_joint: -1.57
      shoulder_pan_joint: 0.0
      wrist_1_joint: -1.57
      wrist_2_joint: 0.0
      wrist_3_joint: 0.0
  - name: home
    group: ur5_manipulator
    joint_values:
      elbow_joint: 1.4059
      shoulder_lift_joint: -2.2564
      shoulder_pan_joint: 0.0
      wrist_1_joint: -1.57
      wrist_2_joint: -1.57
      wrist_3_joint: 0.0
  - name: ready
    group: ur5_manipulator
    joint_values:
      shoulder_pan_joint: -1.0869463595852835e-05
      shoulder_lift_joint: -2.256367243493136
      elbow_joint: 1.4058936840823666
      wrist_1_joint: -1.5699605306002709
      wrist_2_joint: -1.5700007835656586
      wrist_3_joint: -8.577540736798284e-05
  kinematics:
    solver: kdl_kinematics_plugin/KDLKinematicsPlugin
    search_resolution: 0.005
    timeout: 0.005
  joint_limits:
    default_velocity_scaling_factor: 0.1
    default_acceleration_scaling_factor: 0.1
    per_joint: {}
  ompl:
    default_planner_config: RRTConnectkConfigDefault
    planner_configs:
    - RRTConnectkConfigDefault
    - RRTkConfigDefault
    - RRTstarkConfigDefault
    - PRMkConfigDefault
    - PRMstarkConfigDefault
    - ESTkConfigDefault
    - KPIECEkConfigDefault
    - BKPIECEkConfigDefault
    - LBKPIECEkConfigDefault
    projection_evaluator: joints(j1,j2)
    longest_valid_segment_fraction: 0.005
  pilz_cartesian_limits:
    max_trans_vel: 1.0
    max_trans_acc: 2.25
    max_trans_dec: -5.0
    max_rot_vel: 1.57
  initial_positions: {}
  arm_controller:
    name: joint_trajectory_controller
    type: joint_trajectory_controller/JointTrajectoryController
    action_ns: follow_joint_trajectory
    update_rate: 100
    command_interfaces:
    - position
    state_interfaces:
    - position
    - velocity
  disable_collisions:
  - link1: base_link_inertia
    link2: camera_link
    reason: Adjacent
  - link1: base_link_inertia
    link2: ground_plane
